[package]
name = "phifno"
version = "1.0.0"
edition = "2021"
description = "Phient's Fourier crate: the spherical harmonics (the 64 channels as degrees < 8), the Fourier neural operator on the circle, sphere and anisotropic ties, and heat flow exact in Fourier modes. A child of phinet."
license = "MIT OR Apache-2.0"

[dependencies]
phistd = { path = "../phistd" }
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
